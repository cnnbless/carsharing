name: CI Pipeline

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [user-service, fleet-service, order-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven' # Автоматичне кешування залежностей Maven

      - name: Static Code Analysis (Checkstyle)
        run: ./mvnw checkstyle:check -pl ${{ matrix.service }}

      - name: Build and Run Tests
        run: ./mvnw clean test -pl ${{ matrix.service }}