ingress:
  enabled: false

postgres:
  persistence:
    enabled: false # Для dev-середовища диск не зберігається між перезапусками

userService:
  replicas: 1
  image:
    tag: "1.0.0"
  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"
    limits:
      cpu: "250m"
      memory: "256Mi"

fleetService:
  replicas: 1
  image:
    tag: "1.0.0"

orderService:
  replicas: 1
  image:
    tag: "1.0.0"
config:
  profile: "dev"
  logLevel: "DEBUG"