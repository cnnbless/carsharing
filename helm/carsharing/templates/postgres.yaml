{{- if .Values.postgres.enabled -}}
  {{- if .Values.postgres.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "carsharing.fullname" . }}-postgres-pvc
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.postgres.persistence.size }}
---
  {{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carsharing.fullname" . }}-postgres
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: postgres
      instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "carsharing.labels" . | nindent 8 }}
        app: postgres
        instance: {{ .Release.Name }}
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "user_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          env:
            - name: POSTGRES_DB
              value: user_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "carsharing.fullname" . }}-secret
                  key: DB_PASSWORD
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
      volumes:
        - name: postgres-storage
          {{- if .Values.postgres.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "carsharing.fullname" . }}-postgres-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carsharing.fullname" . }}-postgres
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
    instance: {{ .Release.Name }}
  ports:
    - port: 5432
      targetPort: 5432
  {{- end }}