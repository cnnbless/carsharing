apiVersion: v1
kind: Secret
metadata:
  name: {{ include "carsharing.fullname" . }}-secret
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecret | quote }}