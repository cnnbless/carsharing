apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "carsharing.fullname" . }}-config
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.profile | quote }}
  APP_DEFAULT_ROLE: {{ .Values.config.defaultRole | quote }}
  LOGGING_LEVEL_ROOT: {{ .Values.config.logLevel | quote }}
  SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ include "carsharing.fullname" . }}-postgres:5432/user_db"
  SPRING_DATASOURCE_USERNAME: "postgres"