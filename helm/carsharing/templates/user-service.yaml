apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "carsharing.fullname" . }}-user
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
    app: user-service
spec:
  replicas: {{ .Values.userService.replicas }}
  selector:
    matchLabels:
      app: user-service
      instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "carsharing.labels" . | nindent 8 }}
        app: user-service
        instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: user-service
          image: "{{ .Values.userService.image.repository }}:{{ .Values.userService.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.userService.port }}
          envFrom:
            - configMapRef:
                name: {{ include "carsharing.fullname" . }}-config
            - secretRef:
                name: {{ include "carsharing.fullname" . }}-secret
          resources:
            {{- toYaml .Values.userService.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: {{ .Values.userService.port }}
            initialDelaySeconds: 150
            periodSeconds: 15
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "carsharing.fullname" . }}-user
  labels:
    {{- include "carsharing.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.userService.port }}
      targetPort: {{ .Values.userService.port }}
      protocol: TCP
  selector:
    app: user-service
    instance: {{ .Release.Name }}